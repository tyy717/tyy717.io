<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的书架 - 我的日常手记</title>
<style>
:root{
  --paper:#F4F2EC; --surface:#FBFAF6; --milk:#FEFDF8; --seed:#5F7A68;
  --ink:#1F1F1C; --inksoft:#56564E; --muted:#8B887C; --line:rgba(31,31,28,.14);
  --spine:#EFECE1; --cover-ink:#F6F3E8;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rfs:18px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
body.night{
  --paper:#141412; --surface:#1C1C1A; --milk:#23231F; --ink:#EFEDE6; --inksoft:#B9B6AB;
  --muted:#8E8B80; --line:rgba(239,237,230,.16); --spine:#2A2A26;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.75; -webkit-font-smoothing:antialiased;}
a{color:inherit;}
::selection{background:rgba(95,122,104,.16);}
.wrap{max-width:880px; margin:0 auto; padding:44px 32px 80px; position:relative; z-index:0;}

/* masthead */
.masthead{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; padding-bottom:26px; border-bottom:1px solid var(--line);}
.masthead .code{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
.masthead h1{font-family:var(--serif); font-size:clamp(2.2rem,4.4vw,3rem); font-weight:800; letter-spacing:-.02em; line-height:1.1; margin:0;}
.backlink{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; color:var(--muted); white-space:nowrap; padding-bottom:6px; transition:color .25s var(--ease);}
.backlink:hover{color:var(--seed);}

/* section head */
.sec-head{margin-top:52px;}
.sec-kicker{display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted);}
.sec-kicker .rule{flex:1; height:1px; background:var(--line);}
.sec-kicker .dot{width:5px; height:5px; background:var(--seed); border-radius:50%;}
.sec-sub{font-size:14px; color:var(--muted); margin-top:12px; max-width:56ch; line-height:1.85;}

/* shelf stage */
.stage{margin-top:20px; display:flex; align-items:flex-end; overflow-x:auto; overflow-y:hidden; padding:56px 8px 22px; scrollbar-width:none; scroll-behavior:smooth; border-bottom:1px solid var(--line);}
.stage::-webkit-scrollbar{display:none;}
.book{flex:0 0 auto; display:flex; align-items:stretch; margin-right:-6px; cursor:pointer; position:relative; transition:transform .5s var(--ease); animation:book-in .7s var(--ease) both;}
.book:nth-child(1){animation-delay:.02s} .book:nth-child(2){animation-delay:.07s} .book:nth-child(3){animation-delay:.12s}
.book:nth-child(4){animation-delay:.17s} .book:nth-child(5){animation-delay:.22s} .book:nth-child(6){animation-delay:.27s}
@keyframes book-in{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
.book:hover{transform:translateY(-8px);}
.book .spine{width:24px; height:214px; background:linear-gradient(90deg,#E8E4D6,var(--spine) 55%,#E2DDCE); border:1px solid var(--line); border-right:none; border-radius:2px 0 0 2px; display:flex; flex-direction:column; align-items:center; padding:10px 0 12px; gap:8px; color:var(--ink);}
body.night .book .spine{background:linear-gradient(90deg,#2E2E29,var(--spine) 55%,#282824);}
.book .snum{font-family:var(--mono); font-size:8px; letter-spacing:.08em; color:var(--muted);}
.book .stitle{writing-mode:vertical-rl; font-family:var(--serif); font-size:11px; font-weight:600; letter-spacing:3px; line-height:1.1; flex:1; overflow:hidden; white-space:nowrap;}
.book .scirc{width:6px; height:6px; border:1px solid var(--muted); border-radius:50%; flex:0 0 auto;}
.book .cover{width:14px; height:214px; overflow:hidden; position:relative; transition:width .5s var(--ease); border-radius:0 2px 2px 0; box-shadow:2px 4px 14px rgba(30,30,25,.14);}
.book .cover-inner{width:120px; height:100%; padding:13px 12px; display:flex; flex-direction:column; color:var(--cover-ink);}
.book .cov-top{display:flex; justify-content:space-between; font-family:var(--mono); font-size:8px; letter-spacing:.1em; opacity:.85;}
.book .cov-title{margin-top:18px; font-family:var(--serif); font-size:21px; font-weight:700; line-height:1.45; letter-spacing:.04em;}
.book .cov-author{margin-top:9px; font-size:11px; opacity:.8;}
.book .cov-foot{margin-top:auto; font-family:var(--mono); font-size:8px; letter-spacing:.1em; opacity:.85; display:flex; flex-direction:column; gap:4px;}
.book.sel{transform:translateY(-30px); z-index:99 !important;}
.book.sel .cover{width:120px;}
.book.sel::before{content:""; position:absolute; top:-8px; left:24px; right:0; height:8px; background:linear-gradient(180deg,#FBFAF4,#E9E5D8); border:1px solid var(--line); border-bottom:none; transform:skewX(-38deg); transform-origin:bottom left; border-radius:2px 2px 0 0;}
body.night .book.sel::before{background:linear-gradient(180deg,#2E2E29,#242420);}
.stage-empty{padding:40px 4px 20px; color:var(--muted); font-size:14px; line-height:1.9; max-width:48ch;}

/* info block */
.info{margin-top:30px; padding-bottom:30px; border-bottom:1px solid var(--line);}
.info-top{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
.info h3{font-family:var(--serif); font-size:clamp(1.6rem,3vw,2.1rem); font-weight:700; letter-spacing:-.01em; line-height:1.3; margin:0;}
.info .sub{color:var(--muted); font-size:13px; margin-top:8px;}
.info .open-arrow{flex:0 0 auto; width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:transparent; font-size:16px; cursor:pointer; color:var(--ink); transition:border-color .25s var(--ease), color .25s var(--ease), transform .3s var(--ease);}
.info .open-arrow:hover{border-color:var(--seed); color:var(--seed); transform:translate(2px,-2px);}
.info .pbar{height:2px; background:var(--line); margin-top:22px; position:relative; overflow:hidden;}
.info .pbar i{position:absolute; left:0; top:0; bottom:0; background:var(--seed); display:block; transition:width .4s var(--ease);}
.info .pmeta{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:10px;}
.info-foot{display:flex; justify-content:space-between; align-items:center; gap:20px; margin-top:24px; flex-wrap:wrap;}
.counter{display:flex; align-items:center; gap:16px; font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--muted);}
.counter button{border:1px solid var(--line); background:transparent; width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer; color:var(--ink); line-height:1; transition:border-color .25s var(--ease), color .25s var(--ease);}
.counter button:hover{border-color:var(--seed); color:var(--seed);}
.actions{display:flex; gap:12px;}
.btn{appearance:none; border:1px solid var(--seed); background:var(--seed); color:#F7F5EE; font-family:var(--sans); font-size:14px; letter-spacing:.04em; padding:11px 24px; border-radius:2px; cursor:pointer; transition:background .25s var(--ease), transform .25s var(--ease);}
.btn:hover{background:#506A59; transform:translateY(-2px);}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line);}

/* list */
.list-head{margin-top:60px;}
.list{margin-top:18px;}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:20px 4px; border-bottom:1px solid var(--line); cursor:pointer; transition:padding .3s var(--ease), background .3s var(--ease);}
.row:hover{background:var(--surface); padding-left:16px; padding-right:0;}
.row:hover .row-title{color:var(--seed);}
.row-title{font-family:var(--serif); font-size:19px; font-weight:600; transition:color .25s var(--ease);}
.row-sub{color:var(--muted); font-size:12px; margin-top:5px; line-height:1.7;}
.row-code{font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--muted); white-space:nowrap;}
footer{margin-top:64px; color:var(--muted); font-size:11px; text-align:center; font-family:var(--mono); letter-spacing:.16em; text-transform:uppercase;}

/* reader */
#reader{position:fixed; inset:0; background:var(--paper); z-index:200; display:none; flex-direction:column;}
#reader.open{display:flex;}
.rbar{display:flex; align-items:center; gap:8px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--surface);}
.rbar .rtitle{flex:1; min-width:0;}
.rbar .rtitle b{font-family:var(--serif); font-size:15px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rbar .rtitle span{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--seed); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
.rbtn{border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:2px; padding:7px 12px; font-size:12px; cursor:pointer; font-family:var(--mono); letter-spacing:.08em; white-space:nowrap; transition:border-color .25s var(--ease), color .25s var(--ease);}
.rbtn:hover{border-color:var(--seed); color:var(--seed);}
#rScroll{flex:1; overflow-y:auto;}
.rinner{max-width:700px; margin:0 auto; padding:44px 28px 110px;}
.para{font-family:var(--serif); font-size:var(--rfs); line-height:2; margin:0 0 1.1em; text-indent:2em; content-visibility:auto; contain-intrinsic-size:auto 120px;}
.para.chap{text-indent:0; font-weight:700; font-size:calc(var(--rfs) + 4px); margin-top:2em; color:var(--ink); letter-spacing:.02em;}
.rfoot{padding:10px 20px; border-top:1px solid var(--line); background:var(--surface); display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);}
#toc{position:fixed; top:0; right:0; bottom:0; width:min(340px,86vw); background:var(--surface); z-index:210; box-shadow:-12px 0 40px rgba(0,0,0,.16); transform:translateX(105%); transition:transform .35s var(--ease); display:flex; flex-direction:column;}
#toc.open{transform:none;}
#toc .thead{padding:18px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-family:var(--serif);}
#toc .tlist{overflow-y:auto; flex:1;}
.titem{padding:14px 20px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px; display:flex; justify-content:space-between; gap:12px; transition:background .2s var(--ease);}
.titem:hover{background:var(--milk);}
.titem small{color:var(--muted); font-family:var(--mono); font-size:9px; white-space:nowrap;}
.titem.cur{color:var(--seed); font-weight:700;}
.tnone{padding:20px; color:var(--muted); font-size:13px; line-height:1.8;}
.rloading{text-align:center; color:var(--muted); padding:80px 0; font-size:14px;}

@media (max-width:680px){
  .wrap{padding:30px 20px 64px;}
  .stage{padding:44px 4px 18px;}
  .book .spine{height:184px; width:22px;}
  .book .cover{height:184px;}
  .book.sel{transform:translateY(-24px);}
  .rbar{gap:6px; padding:10px 12px; flex-wrap:wrap;}
  .rinner{padding:30px 20px 90px;}
  .row:hover{padding-left:8px;}
}
</style>
</head>
<body>
<div class="wrap" id="shelfView">
  <div class="masthead">
    <div>
      <div class="code">SHELF ARCHIVE — <span id="fileCount">0</span> FILES</div>
      <h1>我的书架</h1>
    </div>
    <a class="backlink" href="index.html">← 日常手记</a>
  </div>

  <div class="sec-head">
    <div class="sec-kicker"><span>COLLECTION / 立体书架</span><span class="rule"></span><span class="dot"></span></div>
    <div class="sec-sub">滑动选书，点封面开始阅读。阅读进度记在你这台设备上。</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="info" id="info" style="display:none">
    <div class="info-top">
      <div>
        <h3 id="infoTitle"></h3>
        <div class="sub" id="infoSub"></div>
      </div>
      <button class="open-arrow" id="openArrow" title="打开阅读">↗</button>
    </div>
    <div class="pbar"><i id="infoBar" style="width:0%"></i></div>
    <div class="pmeta" id="infoMeta"></div>
    <div class="info-foot">
      <div class="counter">
        <button id="prevBtn">‹</button><span id="counterText">0 / 0</span><button id="nextBtn">›</button>
      </div>
      <div class="actions">
        <button class="btn" id="readBtn">开始阅读</button>
      </div>
    </div>
  </div>

  <div class="sec-head list-head">
    <div class="sec-kicker"><span>INDEX / 图书列表</span><span class="rule"></span><span class="dot"></span></div>
  </div>
  <div class="list" id="bookList"></div>

  <footer>© <span id="year"></span> 我的书架</footer>
</div>

<div id="reader">
  <div class="rbar">
    <button class="rbtn" id="rBack">← 书架</button>
    <div class="rtitle"><b id="rTitle"></b><span id="rChapter"></span></div>
    <button class="rbtn" id="fontDown">A−</button>
    <button class="rbtn" id="fontUp">A＋</button>
    <button class="rbtn" id="nightBtn">夜间</button>
    <button class="rbtn" id="tocBtn">目录</button>
  </div>
  <div id="rScroll"><div class="rinner" id="rInner"><div class="rloading">正在翻开这本书…</div></div></div>
  <div class="rfoot"><span id="rCode"></span><span id="rPct">0%</span></div>
</div>

<div id="toc">
  <div class="thead"><b>目录</b><button class="rbtn" id="tocClose">关闭</button></div>
  <div class="tlist" id="tocList"></div>
</div>

<script>
"use strict";
const PALETTE = ["#3E564C","#6B4A3A","#33475B","#8A6D3B","#713F46","#4A4A48","#5B4A68","#2F5D5A"];
const CHAP_RE = /^(第[0-9零一二三四五六七八九十百千两]+[章卷节回篇]|序章|序言|楔子|前言|番外|尾声|后记|大结局)/;
let books = [], sel = 0;
const textCache = new Map(); // id -> {paras, chapters, chars}
const $ = id => document.getElementById(id);
const pad = (n, w) => String(n).padStart(w, "0");
const wkCode = i => "WK-" + pad(i + 1, 5);

async function decodeBuffer(buf){
  try { return new TextDecoder("utf-8", {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder("gb18030").decode(buf); }
}
async function loadText(book){
  if (textCache.has(book.id)) return textCache.get(book.id);
  const buf = await (await fetch(book.file)).arrayBuffer();
  const raw = await decodeBuffer(buf);
  const paras = raw.replace(/\r\n?/g, "\n").split("\n").map(s => s.trim()).filter(Boolean);
  const chapters = [];
  paras.forEach((p, i) => { if (CHAP_RE.test(p)) chapters.push({title: p.length > 40 ? p.slice(0, 40) + "…" : p, index: i}); });
  const data = { paras, chapters, chars: paras.reduce((a, p) => a + p.length, 0) };
  textCache.set(book.id, data);
  return data;
}
function progressOf(book){
  const v = localStorage.getItem("shelf-progress-" + book.id);
  return v === null ? -1 : parseInt(v, 10);
}

/* ---------- shelf ---------- */
function renderShelf(){
  const stage = $("stage");
  stage.innerHTML = "";
  $("fileCount").textContent = books.length;
  if (!books.length){
    stage.innerHTML = '<div class="stage-empty">书架还空着。<br>站长把作品的 txt 放进仓库的 books 文件夹、再在 books_index.json 里加一条记录，第一本书就会立在这里。</div>';
    $("info").style.display = "none";
  }
  books.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "book" + (i === sel ? " sel" : "");
    el.style.zIndex = i + 1;
    el.innerHTML =
      '<div class="spine"><span class="snum">N' + pad(i + 1, 2) + '</span>' +
      '<span class="stitle"></span><span class="scirc"></span></div>' +
      '<div class="cover" style="background:' + PALETTE[i % PALETTE.length] + '"><div class="cover-inner">' +
      '<div class="cov-top"><span>NO.' + pad(i + 1, 3) + '</span><span>本地</span></div>' +
      '<div class="cov-title"></div><div class="cov-author"></div>' +
      '<div class="cov-foot"><span>' + wkCode(i) + '</span><span class="cov-prog"></span></div>' +
      '</div></div>';
    el.querySelector(".stitle").textContent = b.title;
    el.querySelector(".cov-title").textContent = b.title;
    el.querySelector(".cov-author").textContent = b.author || "";
    el.addEventListener("click", () => { if (i === sel) openReader(b); else select(i, true); });
    stage.appendChild(el);
  });
  const list = $("bookList");
  list.innerHTML = "";
  books.forEach((b, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<div><div class="row-title"></div><div class="row-sub"></div></div><div class="row-code">' + wkCode(i) + '</div>';
    row.querySelector(".row-title").textContent = b.title;
    row.querySelector(".row-sub").textContent = (b.author || "") + (b.date ? " · " + b.date : "") + (b.summary ? " · " + b.summary : "");
    row.addEventListener("click", () => { select(i, true); openReader(b); });
    list.appendChild(row);
  });
  updateInfo();
}
function select(i, scroll){
  sel = Math.max(0, Math.min(books.length - 1, i));
  document.querySelectorAll(".book").forEach((el, j) => el.classList.toggle("sel", j === sel));
  if (scroll){
    const el = document.querySelectorAll(".book")[sel];
    if (el) $("stage").scrollTo({left: el.offsetLeft - $("stage").clientWidth / 2 + 60, behavior: "smooth"});
  }
  updateInfo();
}
async function updateInfo(){
  if (!books.length) return;
  const b = books[sel];
  $("info").style.display = "";
  $("infoTitle").textContent = b.title;
  $("counterText").textContent = (sel + 1) + " / " + books.length;
  const saved = progressOf(b);
  $("readBtn").textContent = saved > 0 ? "继续阅读" : "开始阅读";
  $("infoSub").textContent = (b.author || "") + (b.date ? " · " + b.date : "");
  $("infoMeta").textContent = wkCode(sel) + (saved >= 0 ? " · 已读到第 " + (saved + 1) + " 段" : " · 未开始");
  $("infoBar").style.width = "0%";
  try {
    const d = await loadText(b);
    if (books[sel] !== b) return;
    $("infoSub").textContent = (b.author || "") + " · " + (d.chars / 10000).toFixed(1) + " 万字 · " + d.paras.length + " 段";
    if (saved >= 0) $("infoBar").style.width = Math.min(100, Math.round((saved + 1) / d.paras.length * 100)) + "%";
    const cov = document.querySelectorAll(".book")[sel];
    if (cov) cov.querySelector(".cov-prog").textContent = saved >= 0 ? "READ " + Math.round((saved + 1) / d.paras.length * 100) + "%" : "";
  } catch(e){ /* 正文暂不可读时保持基本信息 */ }
}
/* drag to scroll + settle-select */
(function(){
  const stage = $("stage");
  let down = false, startX = 0, startL = 0, moved = false, settleTimer = null;
  stage.addEventListener("pointerdown", e => { down = true; moved = false; startX = e.clientX; startL = stage.scrollLeft; });
  stage.addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - startX; if (Math.abs(dx) > 4) moved = true; stage.scrollLeft = startL - dx; });
  window.addEventListener("pointerup", () => { down = false; });
  stage.addEventListener("click", e => { if (moved){ e.stopPropagation(); moved = false; } }, true);
  stage.addEventListener("scroll", () => {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      const mid = stage.scrollLeft + stage.clientWidth / 2;
      let best = 0, bd = 1e12;
      document.querySelectorAll(".book").forEach((el, j) => { const c = el.offsetLeft + el.clientWidth / 2; const d = Math.abs(c - mid); if (d < bd){ bd = d; best = j; } });
      if (best !== sel) select(best, false);
    }, 140);
  });
})();
$("prevBtn").addEventListener("click", () => select(sel - 1, true));
$("nextBtn").addEventListener("click", () => select(sel + 1, true));
$("readBtn").addEventListener("click", () => openReader(books[sel]));
$("openArrow").addEventListener("click", () => openReader(books[sel]));

/* ---------- reader ---------- */
let cur = null; // {book, data, curPara, io}
const prefs = JSON.parse(localStorage.getItem("shelf-reader-prefs") || "{}");
if (prefs.fontSize) document.documentElement.style.setProperty("--rfs", prefs.fontSize + "px");
if (prefs.night) document.body.classList.add("night");
function savePrefs(){ localStorage.setItem("shelf-reader-prefs", JSON.stringify({fontSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue("--rfs")) || 18, night: document.body.classList.contains("night")})); }

async function openReader(book){
  if (!book) return;
  $("reader").classList.add("open");
  document.body.style.overflow = "hidden";
  $("rTitle").textContent = book.title;
  $("rChapter").textContent = "";
  $("rCode").textContent = wkCode(books.indexOf(book));
  $("rPct").textContent = "0%";
  $("rInner").innerHTML = '<div class="rloading">正在翻开这本书…</div>';
  $("rScroll").scrollTop = 0;
  let data;
  try { data = await loadText(book); }
  catch(e){ $("rInner").innerHTML = '<div class="rloading">这本书暂时打不开，请稍后再试。</div>'; return; }
  cur = { book, data, curPara: 0 };
  const chapSet = new Set(data.chapters.map(c => c.index));
  const frag = document.createDocumentFragment();
  data.paras.forEach((p, i) => {
    const el = document.createElement("p");
    el.className = "para" + (chapSet.has(i) ? " chap" : "");
    el.dataset.i = i;
    el.textContent = p;
    frag.appendChild(el);
  });
  const inner = $("rInner");
  inner.innerHTML = "";
  inner.appendChild(frag);
  buildToc();
  // progress observer
  if (cur.io) cur.io.disconnect();
  let saveTimer = null;
  cur.io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        cur.curPara = parseInt(en.target.dataset.i, 10);
        onParaChange();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => localStorage.setItem("shelf-progress-" + book.id, String(cur.curPara)), 400);
      }
    });
  }, { root: $("rScroll"), rootMargin: "0px 0px -82% 0px", threshold: 0 });
  inner.querySelectorAll(".para").forEach(el => cur.io.observe(el));
  const saved = progressOf(book);
  if (saved > 0){
    const target = inner.querySelector('.para[data-i="' + saved + '"]');
    if (target) requestAnimationFrame(() => requestAnimationFrame(() => target.scrollIntoView({block: "start"})));
    cur.curPara = saved;
    onParaChange();
  }
}
function currentChapter(){
  if (!cur) return null;
  let ch = null;
  for (const c of cur.data.chapters){ if (c.index <= cur.curPara) ch = c; else break; }
  return ch;
}
function onParaChange(){
  if (!cur) return;
  const total = cur.data.paras.length;
  $("rPct").textContent = Math.round((cur.curPara + 1) / total * 100) + "% · 第 " + (cur.curPara + 1) + " / " + total + " 段";
  const ch = currentChapter();
  $("rChapter").textContent = ch ? ch.title : "";
  document.querySelectorAll(".titem").forEach(el => el.classList.toggle("cur", ch && parseInt(el.dataset.i, 10) === ch.index));
}
function buildToc(){
  const list = $("tocList");
  list.innerHTML = "";
  if (!cur.data.chapters.length){
    list.innerHTML = '<div class="tnone">本书未检测到章节。<br>正文里单独成行、以「第几章」等开头的段落会被自动认成章节。</div>' +
      '<div class="titem" data-i="0"><span>全文 · 从开头读</span><small>0%</small></div>';
  } else {
    const head = document.createElement("div");
    head.className = "tnone";
    head.textContent = "共 " + cur.data.chapters.length + " 章 · 自动分章";
    list.appendChild(head);
    cur.data.chapters.forEach(c => {
      const el = document.createElement("div");
      el.className = "titem";
      el.dataset.i = c.index;
      el.innerHTML = "<span></span><small>" + Math.round(c.index / cur.data.paras.length * 100) + "%</small>";
      el.querySelector("span").textContent = c.title;
      list.appendChild(el);
    });
  }
  list.querySelectorAll(".titem").forEach(el => el.addEventListener("click", () => {
    const target = document.querySelector('.para[data-i="' + el.dataset.i + '"]');
    if (target) target.scrollIntoView({block: "start"});
    $("toc").classList.remove("open");
  }));
}
function closeReader(){
  $("reader").classList.remove("open");
  document.body.style.overflow = "";
  if (cur && cur.io) cur.io.disconnect();
  updateInfo();
}
$("rBack").addEventListener("click", closeReader);
$("tocBtn").addEventListener("click", () => {
  $("toc").classList.add("open");
  const curEl = document.querySelector(".titem.cur");
  if (curEl) curEl.scrollIntoView({block: "center"});
});
$("tocClose").addEventListener("click", () => $("toc").classList.remove("open"));
$("fontUp").addEventListener("click", () => setFont(1));
$("fontDown").addEventListener("click", () => setFont(-1));
function setFont(d){
  const now = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--rfs")) || 18;
  const next = Math.max(14, Math.min(26, now + d));
  document.documentElement.style.setProperty("--rfs", next + "px");
  savePrefs();
}
$("nightBtn").addEventListener("click", () => { document.body.classList.toggle("night"); savePrefs(); });

/* ---------- boot ---------- */
$("year").textContent = new Date().getFullYear();
fetch("books_index.json").then(r => r.json()).then(list => {
  books = Array.isArray(list) ? list : [];
  renderShelf();
}).catch(() => { books = []; renderShelf(); });
</script>
