<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志详情 - 我的日常手记</title>

    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="css/dark-mode.css" as="style">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html"><span class="brand-mark"></span>日常手记</a>
            <nav class="nav">
                <a href="shelf.html">书架</a>
                <a href="diary.html" class="is-active">日记</a>
                <a href="index.html#about">关于</a>
            </nav>
            <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="reading-progress" id="reading-progress"></div>

    <main class="article-wrap">
        <article id="post-content">
            <p class="loading"><i class="fas fa-spinner fa-spin"></i> 正在加载日志...</p>
        </article>

        <div class="article-foot">
            <a href="diary.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回日记归档</a>
            <a href="index.html" class="back-link">首页 <i class="fas fa-arrow-right"></i></a>
        </div>
    </main>

    <footer>
        <div class="foot-inner">
            <span>© <span id="current-year"></span> 我的日常手记</span>
            <span>DAILY NOTES</span>
        </div>
    </footer>

    <script src="js/ui.js" defer></script>
    <script src="js/progress.js" defer></script>
    <script src="js/main.js"></script>
    <script>
        const postId = new URLSearchParams(window.location.search).get('id');
        if (postId) {
            loadSinglePost(postId);
        } else {
            document.getElementById('post-content').innerHTML = '<p class="error">未指定日志。<a href="diary.html">返回归档</a></p>';
        }
    </script>
</body>
</html>
